name: Update service

on:
  repository_dispatch:
    types: [service-tagged]
  workflow_dispatch:
    inputs:
      path:
        description: Service folder
        required: true
      tag:
        description: Tag name
        required: true
      sha:
        description: Commit the tag points to
        required: true

concurrency:
  group: update-${{ github.event.client_payload.path || inputs.path }}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point submodule at tagged commit
        env:
          SERVICE: ${{ github.event.client_payload.path || inputs.path }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git config -f .gitmodules --get "submodule.$SERVICE.path" || true)" != "$SERVICE" ]; then
            echo "::error::Unknown service '$SERVICE'"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid commit sha '$SHA'"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Runs for different services can race, so a rejected push starts over from the
          # latest main. Rebasing would drop the commit: with ignore = all in .gitmodules,
          # gitlink-only commits all look empty and get skipped as already applied.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git update-index --cacheinfo "160000,$SHA,$SERVICE"
            if git diff --cached --quiet --ignore-submodules=none; then
              echo "$SERVICE already at $SHA"
              exit 0
            fi
            git commit -m "chore($SERVICE): update to $TAG"
            git push origin HEAD:main && exit 0
          done
          exit 1
